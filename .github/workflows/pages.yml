# GymGO's website on GitHub Pages: the limited version (scripts/pages-build.sh),
# built and published on every push to this branch that changes the app.
# Free for a public repository. See README, "The website on GitHub Pages".
#
# Once, in the repository's Settings (an owner's job):
#   Pages > Build and deployment > Source: GitHub Actions.
#   Environments > github-pages > Deployment branches: add this branch
#   (it allows only the default branch to start with).
name: Website (GitHub Pages)

on:
  push:
    branches: [claude/friendly-johnson-9rzxrj]
    paths:
      - apps/mobile/**
      - packages/**
      - patches/**
      - pnpm-lock.yaml
      - scripts/pages-build.sh
      - scripts/web-assets.sh
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time; a newer push waits rather than cutting one off halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Only the tests use a browser; the build doesn't need one downloaded.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5
      # pnpm's version comes from package.json's packageManager.
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter "@gymgo/mobile..."
      # Where Pages serves the site: /GymGO on github.io, the root once a custom domain is set.
      - id: pages
        uses: actions/configure-pages@v6
      - run: bash scripts/pages-build.sh
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/mobile/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
