<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -14 1592 1478" role="img" aria-label="GymGO">
  <title>GymGO</title>
  <style>
    .star { fill: #3e469d; transform-origin: 0 0; transform: rotate(0deg); transition: transform 1.1s cubic-bezier(0.65, 0, 0.35, 1); will-change: transform; }
    svg:hover .star { transform: rotate(360deg); transition: transform 1.6s cubic-bezier(0.45, 0, 0.2, 1); }
    .arm { fill: #fff; }
    .arm-edge { fill: none; stroke: #3e469d; stroke-width: 59px; stroke-linejoin: round; }
    .arm-line { fill: none; stroke: #3e469d; stroke-linecap: round; stroke-miterlimit: 10; stroke-width: 59px; }
    .eye { fill: #fff; transform-origin: 0 0; }
    svg:hover .eye { animation: gymgo-blink 3.2s infinite; }
    @keyframes gymgo-blink {
      0%, 40%, 100% { transform: scaleY(1); animation-timing-function: cubic-bezier(0.5, 0, 0.75, 0); }
      4% { transform: scaleY(0.06); animation-timing-function: cubic-bezier(0.25, 1, 0.5, 1); }
      9% { transform: scaleY(1); }
      44% { transform: scaleY(0.06); animation-timing-function: cubic-bezier(0.25, 1, 0.5, 1); }
      49% { transform: scaleY(1); }
    }
    @media (prefers-reduced-motion: reduce) { .star, svg:hover .star { transform: none; transition: none; } svg:hover .eye { animation: none; } }
  </style>
