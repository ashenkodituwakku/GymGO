<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!-- What the site is, for search engines and for the preview a shared link shows.
         The preview's picture is public/og.png (scripts/site-images.mjs); a host that
         knows its own address can make its path absolute (scripts/netlify-build.sh does). -->
    <meta name="description" content="Find a gym that fits your workout, budget and visit time: whether it takes visitors, what a visit costs and what it has to train with." />
    <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="GymGO" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GymGO" />
    <meta property="og:title" content="GymGO" />
    <meta property="og:description" content="Find a gym that fits your workout, budget and visit time." />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The GymGO app icon, with the words: Find a gym that fits your workout, budget and visit time." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og.png" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <!-- The loading screen: what shows while the app's code downloads, as the phone app's splash
         screen does (app.json): its picture on the page's own colour, light or dark. The app takes
         it away once it's drawn (src/app/_layout.tsx). The picture is public/icons/splash.png
         (scripts/site-images.mjs). -->
    <style id="gymgo-boot-style">
      body {
        margin: 0;
        background: #f2f2f7;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #000;
        }
      }
      html[data-boot='light'] body {
        background: #f2f2f7;
      }
      html[data-boot='dark'] body {
        background: #000;
      }
      html[data-boot='dim'] body {
        background: #17191f;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        pointer-events: none;
        z-index: 1;
        font: 15px/1.4 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        color: #6c6c70;
      }
      @media (prefers-color-scheme: dark) {
        #boot {
          color: #a1a1a6;
        }
      }
      html[data-boot='light'] #boot {
        color: #6c6c70;
      }
      html[data-boot='dark'] #boot,
      html[data-boot='dim'] #boot {
        color: #a1a1a6;
      }
      #boot img {
        width: 120px;
        height: 120px;
      }
      /* Only said if it's taking a while: nothing for a quick load to flash. */
      #boot p {
        margin: 0;
        padding: 0 32px;
        max-width: 320px;
        text-align: center;
        opacity: 0;
        animation: gymgo-boot-late 0.4s ease 6s forwards;
      }
      @keyframes gymgo-boot-late {
        to {
          opacity: 1;
        }
      }
    </style>
    <script>
      // Light or dark as chosen in GymGO's own Appearance settings, when that isn't the device's.
      try {
        var saved = JSON.parse(localStorage.getItem('gymgo.theme.v1') || 'null');
        var boot = saved && saved.appearance === 'light' ? 'light' : saved && saved.appearance === 'dark' ? 'dark' : null;
        var dim = saved && saved.dark === 'dim';
        if (dim && (boot === 'dark' || (!boot && matchMedia('(prefers-color-scheme: dark)').matches))) boot = 'dim';
        if (boot) document.documentElement.setAttribute('data-boot', boot);
      } catch (e) {}
    </script>
  </head>

  <body>
    <noscript>
      GymGO runs in your browser with JavaScript. Turn it on to use the site.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
    <div id="boot" role="status">
      <img src="/icons/splash.png" alt="Loading GymGO" width="120" height="120" />
      <p>Still loading. The first visit can take a little while on a slow connection.</p>
    </div>
  </body>
</html>
