, Arial, sans-serif' font-size='15' font-weight='bold' fill='#1c1c1e'>Anything still</text><text x='470' y='1054.5' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='15' font-weight='bold' fill='#1c1c1e'>TO CONFIRM?</text><rect x='65.0' y='1010.0' width='210' height='60' rx='6' fill='#fff4e5' stroke='#c93400' stroke-width='2'/><text x='170' y='1035.5' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='15' font-weight='normal' fill='#1c1c1e'>Verdict: Call first</text><text x='170' y='1054.5' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='15' font-weight='normal' fill='#1c1c1e'>(list what to ask)</text><rect x='355.0' y='1139.5' width='230' height='41' rx='6' fill='#eafaf1' stroke='#248a3d' stroke-width='2'/><text x='470' y='1165.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='15' font-weight='normal' fill='#1c1c1e'>Verdict: Good to go</text><polygon points='470,1240.0 605.0,1300 470,1360.0 335.0,1300' fill='#eafaf1' stroke='#30a46c' stroke-width='2'/><text x='470' y='1295.5' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='15' font-weight='bold' fill='#1c1c1e'>More gyms</text><text x='470' y='1314.5' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='15' font-weight='bold' fill='#1c1c1e'>to check?</text><rect x='260.0' y='1395.0' width='420' height='60' rx='6' fill='#e8f0fe' stroke='#0a84ff' stroke-width='2'/><text x='470' y='1420.5' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='15' font-weight='normal' fill='#1c1c1e'>Sort: Good to go, then Call first, then Not a fit.</text><text x='470' y='1439.5' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='15' font-weight='normal' fill='#1c1c1e'>Unknown prices go last, never shown as $0</text><polygon points='308.0,1495.0 668.0,1495.0 632.0,1555.0 272.0,1555.0' fill='#fff4e5' stroke='#ff9f0a' stroke-width='2'/><text x=