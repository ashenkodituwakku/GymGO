<text x='24' y='58' font-family='Helvetica, Arial, sans-serif' font-size='15' fill='#636366'>Finding a gym to visit</text>
<rect x='395' y='17' width='150' height='46' rx='23' fill='#5856d6'/><text x='470' y='45.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='15' font-weight='bold' fill='#ffffff'>Start</text><rect x='320.0' y='99.5' width='300' height='41' rx='6' fill='#e8f0fe' stroke='#0a84ff' stroke-width='2'/><text x='470' y='125.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='15' font-weight='normal' fill='#1c1c1e'>Open GymGO</text><polygon points='470,170.0 605.0,230 470,290.0 335.0,230' fill='#eafaf1' stroke='#30a46c' stroke-width='2'/><text x='470' y='225.5' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='15' font-weight='bold' fill='#1c1c1e'>First time</text><text x='470' y='244.5' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='15' font-weight='bold' fill='#1c1c1e'>opening it?</text><rect x='640.0' y='209.5' width='260' height='41' rx='6' fill='#e8f0fe' stroke='#0a84ff' stroke-width='2'/><text x='770' y='235.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='15' font-weight='normal' fill='#1c1c1e'>Show the 3 welcome pages</text><rect x='320.0' y='329.5' width='300' height='41' rx='6' fill='#e8f0fe' stroke='#0a84ff' stroke-width='2'/><text x='470' y='355.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='15' font-weight='normal' fill='#1c1c1e'>Home screen</text><polygon points='308.0,420.0 668.0,420.0 632.0,480.0 272.0,480.0' fill='#fff4e5' stroke='#ff9f0a' stroke-width='2'/><text x='470' y='445.5' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='15' font-weight='normal' fill='#1c1c1e'>Input: a place (suburb, city or gym),</text><text x='470' y='464.5' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='15' font-weight='normal' fill='#1c1c1e'>visit time, and budget if they want</text><rect x='320.0' y='534.5' width='300' height='41' rx='6' fill='#e8f0fe' stroke='#0a