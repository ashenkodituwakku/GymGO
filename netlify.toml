# GymGO's website on Netlify: the app, exported for the browser
# (scripts/netlify-build.sh). The GymGO server runs elsewhere; set
# GYMGO_SERVER_URL in Netlify and the site passes it /api and the legal pages.
# Until then the website works on its own, with the gyms built into the app.
# See README, "The website on Netlify".

[build]
  command = "bash scripts/netlify-build.sh"
  publish = "apps/mobile/dist"

[build.environment]
  NODE_VERSION = "22"
  # The website can be used without an account (the app still needs one): lib/accountRule.ts.
  EXPO_PUBLIC_ACCOUNT = "optional"
  # Only the tests use a browser; the build doesn't need one downloaded.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"

# The same headers Caddy sends (deploy/Caddyfile).
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    # The web app finds gyms near you, so location is allowed for this site and nothing it embeds.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self), payment=()"

# Scripts and pictures are named for what's in them, so they keep for a year.
[[headers]]
  for = "/_expo/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
